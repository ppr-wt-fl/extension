name: release

# Push a tag like v1.2.0 (matching package.json "version") to build the extension in Docker and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json version
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"

      - run: docker build --output release .
      - run: cd release && sha256sum *.zip > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS --generate-notes --notes "Testers: download the zip below and follow [TESTERS.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/TESTERS.md)."
