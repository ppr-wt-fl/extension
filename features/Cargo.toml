[package]
name = "adflush_features"
version = "0.1.0"
edition = "2024"

[dependencies]
idna = "1.1.0"
oxc_allocator = "0.152.0"
oxc_ast = { version = "0.152.0", features = ["serialize"] }
oxc_parser = "0.152.0"
oxc_span = "0.152.0"
regex = "1.13.1"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["preserve_order", "unbounded_depth"] }
wasm-bindgen = "=0.2.126"

[lib]
crate-type = ["cdylib", "rlib"]
